const ITERS=600000;
function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function tryOpen(pw){
  const raw=b64(PAYLOAD);
  const salt=raw.slice(0,16), iv=raw.slice(16,28), body=raw.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITERS,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,body);
  // GCM auth tag guarantees integrity — tampered payload throws before here.
  const html=new TextDecoder().decode(plain);
  document.getElementById('content').srcdoc=html;
  document.body.classList.add('open');
  try{sessionStorage.setItem('aicoding.pw',pw);}catch(_){/* private mode */}
}
document.getElementById('gate').addEventListener('submit',async function(e){
  e.preventDefault();
  const pw=document.getElementById('pw').value;
  try{await tryOpen(pw);}catch(_){
    const el=document.getElementById('err');el.style.display='block';
    document.getElementById('pw').select();
  }
});
(function(){
  let saved=null;
  try{saved=sessionStorage.getItem('aicoding.pw');}catch(_){/* private mode */}
  if(saved){tryOpen(saved).catch(function(){/* stale pw — show form */});}
})();
</script>
