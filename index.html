<title>AI Coding 演進 · 課程教材</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:#0F141B;color:#E9EDF1;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;}
  .gatewrap{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .gate{width:min(90vw,380px);border:1px solid #2A3542;border-radius:8px;
    background:#161E29;padding:2rem;}
  .gate h1{font-size:1.05rem;font-weight:700;margin-bottom:.4rem;}
  .gate p{color:#93A1B0;font-size:.85rem;line-height:1.6;margin-bottom:1.2rem;}
  .gate input{width:100%;padding:.6rem .8rem;border-radius:6px;border:1px solid #39485A;
    background:#0F141B;color:#E9EDF1;font-size:1rem;}
  .gate input:focus{outline:2px solid #E3A93C;outline-offset:1px;border-color:#E3A93C;}
  .gate button{margin-top:.9rem;width:100%;padding:.6rem;border-radius:6px;border:none;
    background:#E3A93C;color:#141414;font-weight:700;font-size:.95rem;cursor:pointer;}
  .gate .err{color:#E25B4A;font-size:.8rem;margin-top:.7rem;display:none;}
  .gate .tag{font-family:ui-monospace,Menlo,monospace;font-size:.68rem;color:#5F6E7E;
    letter-spacing:.15em;margin-bottom:1rem;}
  #content{position:fixed;inset:0;width:100%;height:100%;border:none;display:none;}
  body.open .gatewrap{display:none;}
  body.open #content{display:block;}
</style>

<body>
<div class="gatewrap">
<form class="gate" id="gate">
  <div class="tag">AI CODING 演進 · 教材</div>
  <h1>這份教材需要密碼</h1>
  <p>內容以 AES-256 加密。輸入一次，整站解鎖（同一分頁有效）。</p>
  <input type="password" id="pw" placeholder="密碼" autocomplete="off" autofocus>
  <button type="submit">解鎖</button>
  <div class="err" id="err">密碼不對，再試一次。</div>
</form>
</div>

const ITERS=600000;
function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function tryOpen(pw){
  const raw=b64(PAYLOAD);
  const salt=raw.slice(0,16), iv=raw.slice(16,28), body=raw.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITERS,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,body);
  // GCM auth tag guarantees integrity — tampered payload throws before here.
  const html=new TextDecoder().decode(plain);
  document.getElementById('content').srcdoc=html;
  document.body.classList.add('open');
  try{sessionStorage.setItem('aicoding.pw',pw);}catch(_){/* private mode */}
}
document.getElementById('gate').addEventListener('submit',async function(e){
  e.preventDefault();
  const pw=document.getElementById('pw').value;
  try{await tryOpen(pw);}catch(_){
    const el=document.getElementById('err');el.style.display='block';
    document.getElementById('pw').select();
  }
});
(function(){
  let saved=null;
  try{saved=sessionStorage.getItem('aicoding.pw');}catch(_){/* private mode */}
  if(saved){tryOpen(saved).catch(function(){/* stale pw — show form */});}
})();
</script>
