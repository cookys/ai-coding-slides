<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>實錄重演 · /l5 跨模型 run</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#0F141B;--panel:#161E29;--panel2:#1B2432;--line:#2A3542;--line2:#39485A;
    --text:#E9EDF1;--muted:#93A1B0;--dim:#5F6E7E;--accent:#E3A93C;--accent-dim:#9C7526;
    --red:#E25B4A;--green:#58B98A;
    --mono:ui-monospace,Menlo,Consolas,monospace;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:3rem 1rem 4rem;}
  .head{max-width:860px;width:100%;margin-bottom:1.2rem;}
  .back{font-family:var(--mono);font-size:.78rem;margin-bottom:1rem;}
  .back a{color:var(--accent);text-decoration:none;}
  .eyebrow{font-family:var(--mono);font-size:.72rem;color:var(--accent);letter-spacing:.25em;margin-bottom:.5rem;}
  h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:900;}
  .honest{margin-top:.6rem;font-size:.8rem;color:var(--dim);border-left:3px solid var(--accent-dim);padding-left:.8rem;line-height:1.6;}
  .term{max-width:860px;width:100%;background:#0A0E14;border:1px solid var(--line2);border-radius:10px;overflow:hidden;}
  .tbar{display:flex;align-items:center;gap:.5rem;background:var(--panel2);border-bottom:1px solid var(--line2);padding:.55rem 1rem;}
  .dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--line2);}
  .dot.r{background:#5a3833;} .dot.y{background:var(--accent-dim);} .dot.g{background:#2e4f41;}
  .ttitle{font-family:var(--mono);font-size:.7rem;color:var(--dim);margin-left:.6rem;}
  .screen{padding:1.1rem 1.3rem;min-height:22rem;max-height:60vh;overflow-y:auto;
    font-family:var(--mono);font-size:.82rem;line-height:1.75;}
  .ln{white-space:pre-wrap;word-break:break-all;}
  .ln.cmd{color:var(--text);}
  .ln.cmd::before{content:"❯ ";color:var(--green);}
  .ln.you::before{content:"你 ▸ ";color:var(--accent);}
  .ln.out{color:var(--muted);}
  .ln.ok{color:var(--green);}
  .ln.warn{color:var(--red);}
  .ln.note{color:var(--bg);background:var(--accent);border-radius:6px;padding:.3rem .8rem;
    margin:.7rem 0;font-family:var(--sans);font-weight:700;font-size:.82rem;display:inline-block;}
  .cursor{display:inline-block;width:.55em;height:1.05em;background:var(--accent);vertical-align:text-bottom;
    animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .ctrl{max-width:860px;width:100%;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;
    margin-top:.9rem;font-family:var(--mono);font-size:.78rem;}
  .ctrl button{background:var(--panel);border:1px solid var(--line2);color:var(--text);
    border-radius:6px;padding:.4rem .9rem;cursor:pointer;font-family:var(--mono);font-size:.78rem;}
  .ctrl button:hover{border-color:var(--accent);color:var(--accent);}
  .ctrl button.on{border-color:var(--accent);color:var(--accent);}
  .ctrl .sp{color:var(--dim);margin-left:auto;}
  @media (prefers-reduced-motion:reduce){.cursor{animation:none;}}
</style>
</head>
<body>
<div class="head">
  <p class="back"><a href="./" target="_top">⌂ 課程目錄</a></p>
  <div class="eyebrow">第 4 堂 · 實錄一重演</div>
  <h1>/l5 跨模型自主 run —— 從一行指令到 merge</h1>
  <p class="honest">依 2026-07-02 真實 run 紀錄重演（autopilot「full-suite-green」專案：R1 審查抓到 committer-identity 邊角 → R2 收斂）。輸出樣貌經簡化；輪次、發現與裁決皆為當次真實內容。</p>
</div>
<div class="term">
  <div class="tbar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="ttitle">cookys@dev — /l5 run replay</span></div>
  <div class="screen" id="screen"></div>
</div>
<div class="ctrl">
  <button id="play">⏸ 暫停</button>
  <button data-sp="1" class="spd on">1×</button><button data-sp="2" class="spd">2×</button><button data-sp="4" class="spd">4×</button>
  <button id="restart">↻ 重播</button>
  <span style="color:var(--dim)">章節：</span>
  <button data-ch="0" class="ch">① 下指令</button><button data-ch="1" class="ch">② Ledger</button>
  <button data-ch="2" class="ch">③ 升級提問</button><button data-ch="3" class="ch">④ 親驗</button>
  <span class="sp" id="prog"></span>
</div>
<script>
const SCRIPT=[
 // ch0 下指令
 {ch:0,t:'note',x:'① 下指令 —— 四個 CEO startup 問題已被 /l5 預設填掉'},
 {ch:0,t:'cmd',x:'bash scripts/resolve-review-loop.sh --check-scorecard'},
 {ch:0,t:'out',x:'{ "implementer_engine":"gpt-5.3-codex-spark", "implementer_runner":"codex",'},
 {ch:0,t:'out',x:'  "reviewer_engine":"gpt-5.5", "reviewer_effort":"xhigh", "reviewer_qualified":true,'},
 {ch:0,t:'out',x:'  "loop_max_rounds":3, "loop_convergence_verdict":"SHIP-AS-IS" }'},
 {ch:0,t:'note',x:'引擎名單是設定檔，不是每次手打 —— 實作 A 家、審查 B 家'},
 {ch:0,t:'cmd',x:'BASE=$(git rev-parse develop)   # 96d9349… 不可變的 SHA，不用會漂移的分支名'},
 {ch:0,t:'cmd',x:'node bin/autopilot.js engine implement-review \\\n    --prompt-file task.md --branch fix/wrapper-commit-identity --base "$BASE"'},
 {ch:0,t:'out',x:'engine: roster resolved · worktree isolated · dispatching round 1…'},
 // ch1 ledger
 {ch:1,t:'note',x:'② Ledger —— 誰做的、誰審的、證據在哪，逐輪記帳'},
 {ch:1,t:'out',x:'[R1] implement  runner=codex model=gpt-5.3-codex-spark → status=committed  commit=ab7f2c1 (+41/−6)'},
 {ch:1,t:'out',x:'[R1] review     runner=codex model=gpt-5.5 (xhigh) → verdict=FIX-THEN-SHIP  findings=1'},
 {ch:1,t:'warn',x:'     └─ 🟠 wrapper commit 在「只設 author、未設 committer」的環境會失敗 —— fallback identity 沒有覆蓋 committer 側'},
 {ch:1,t:'note',x:'真實發現：實作者自己的測試是綠的 —— 這個邊角是「另一個腦袋」抓到的'},
 {ch:1,t:'out',x:'[R2] implement  repair branch → status=committed  commit=cd91e04 (+9/−1)'},
 {ch:1,t:'ok', x:'[R2] review     verdict=SHIP-AS-IS ✓   converged  rounds=2'},
 // ch2 escalation
 {ch:2,t:'note',x:'③ 升級提問 —— 整段 run 只回來問了這一題'},
 {ch:2,t:'out',x:'[ESCALATION] 邊界題：fallback identity 應「只在 author/committer 缺席時注入」還是「一律注入」？\n             影響所有 hetero runner 的 commit 溯源。'},
 {ch:2,t:'you',x:'只在缺席時注入 —— 溯源優先。'},
 {ch:2,t:'out',x:'[ESCALATION] resolved · run continues'},
 {ch:2,t:'note',x:'紅線、真取捨才升級 —— 戰術小事它自己吞掉了'},
 // ch3 depth-0
 {ch:3,t:'note',x:'④ Depth-0 親驗 —— AI 的綠不是權威'},
 {ch:3,t:'cmd',x:'git diff --stat 96d9349..cd91e04'},
 {ch:3,t:'out',x:' scripts/dispatch-hetero.sh      | 38 ++++++++---\n hooks/tests/dispatch-hetero.test.sh | 12 ++++\n 2 files changed, 44 insertions(+), 6 deletions(−)'},
 {ch:3,t:'cmd',x:'bash hooks/tests/dispatch-hetero.test.sh'},
 {ch:3,t:'ok', x:'PASS [dispatch-hetero] 51 assertions'},
 {ch:3,t:'cmd',x:'git merge --no-ff fix/wrapper-commit-identity && git push'},
 {ch:3,t:'ok', x:'merged → develop · worktrees reaped'},
 {ch:3,t:'note',x:'裁決權從頭到尾沒離開人 —— 委派的是勞務，不是信任'},
];
const S=document.getElementById('screen');let i=0,playing=true,speed=1,timer=null;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function addLine(item,cb){
  const d=document.createElement('div');d.className='ln '+item.t;S.appendChild(d);
  if(item.t==='cmd'||item.t==='you'){
    let k=0;const txt=item.x;const cur=document.createElement('span');cur.className='cursor';d.appendChild(cur);
    (function type(){
      if(!playing){timer=setTimeout(type,120);return;}
      if(k<txt.length){d.insertBefore(document.createTextNode(txt[k++]),cur);S.scrollTop=S.scrollHeight;timer=setTimeout(type,18/speed);}
      else{cur.remove();cb();}
    })();
  }else{
    d.innerHTML=esc(item.x).replace(/\n/g,'<br>');S.scrollTop=S.scrollHeight;
    timer=setTimeout(cb,(item.t==='note'?1400:650)/speed);
  }
}
function step(){
  if(i>=SCRIPT.length){document.getElementById('prog').textContent='完 · ↻ 可重播';return;}
  document.getElementById('prog').textContent=(i+1)+' / '+SCRIPT.length;
  addLine(SCRIPT[i++],()=>{ if(playing)step(); else{const w=()=>playing?step():setTimeout(w,150);w();} });
}
function jump(ch){clearTimeout(timer);S.innerHTML='';i=SCRIPT.findIndex(l=>l.ch===ch);if(i<0)i=0;playing=true;
  document.getElementById('play').textContent='⏸ 暫停';step();}
document.getElementById('play').addEventListener('click',function(){playing=!playing;this.textContent=playing?'⏸ 暫停':'▶ 播放';});
document.getElementById('restart').addEventListener('click',()=>jump(0));
document.querySelectorAll('.spd').forEach(b=>b.addEventListener('click',function(){speed=+this.dataset.sp;
  document.querySelectorAll('.spd').forEach(x=>x.classList.remove('on'));this.classList.add('on');}));
document.querySelectorAll('.ch').forEach(b=>b.addEventListener('click',function(){jump(+this.dataset.ch);}));
step();
</script>
</body>
</html>
